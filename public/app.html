<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InternPath – Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f7f8fc;
            --surface: #fff;
            --text: #16192c;
            --muted: #5b6078;
            --accent: #4f46e5;
            --accent-text: #fff;
            --soft: #eceeff;
            --border: #e2e4ef;
            color-scheme: light
        }

        @media (prefers-color-scheme:dark) {
            :root {
                --bg: #0f111a;
                --surface: #181b29;
                --text: #eef0fa;
                --muted: #a1a6c0;
                --accent: #8b85ff;
                --accent-text: #0f111a;
                --soft: #232742;
                --border: #2c3050;
                color-scheme: dark
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5
        }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 20px 48px
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            gap: 10px;
            flex-wrap: wrap
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text);
            text-decoration: none
        }

        .logo span {
            color: var(--accent)
        }

        h1 {
            font-size: clamp(1.4rem, 5vw, 1.9rem);
            margin: 6px 0 4px
        }

        .sub {
            color: var(--muted);
            margin: 0 0 20px
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 14px
        }

        h2 {
            font-size: 1.05rem;
            margin: 0 0 12px
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: .95rem;
            font-family: inherit;
            margin-bottom: 8px
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: 0;
            background: var(--accent);
            color: var(--accent-text);
            font-weight: 600;
            cursor: pointer;
            font-size: .92rem
        }

        .btn.g {
            background: #1f9d6b;
            color: #fff
        }

        .btn.r {
            background: transparent;
            color: #d9435a;
            border: 1px solid #d9435a
        }

        .btn.o {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent)
        }

        .auth {
            max-width: 400px;
            margin: 40px auto
        }

        .err {
            color: #d9435a;
            min-height: 1.3em;
            font-size: .9rem
        }

        .t {
            border-top: 1px solid var(--border);
            padding: 14px 0
        }

        .t:first-of-type {
            border-top: 0
        }

        .t h3 {
            margin: 0;
            font-size: 1rem
        }

        .t p {
            margin: 4px 0;
            color: var(--muted);
            font-size: .92rem
        }

        .st {
            display: inline-block;
            font-size: .78rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 99px;
            background: var(--soft);
            color: var(--accent);
            margin-left: 8px
        }

        .st.Approved {
            background: #d9f5e7;
            color: #13774d
        }

        .st.Changes {
            background: #fde2e6;
            color: #b3243c
        }

        .st.Submitted {
            background: #fff0cf;
            color: #9a6200
        }

        .acts,
        .sl {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px
        }

        .sl input {
            margin: 0;
            flex: 1;
            min-width: 180px
        }

        .bar {
            height: 12px;
            background: var(--soft);
            border-radius: 99px;
            overflow: hidden;
            margin: 8px 0
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--accent)
        }

        .ok {
            color: #13774d;
            font-weight: 600
        }

        .crt {
            container-type: inline-size;
            position: relative;
            aspect-ratio: 1280/853;
            background: #fbfaf5;
            color: #0f2a5c;
            overflow: hidden;
            margin-bottom: 14px;
            font-family: Montserrat, "Segoe UI", system-ui, sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact
        }

        .crt>* {
            position: absolute
        }

        .crt .cw {
            inset: 0;
            width: 100%;
            height: 100%
        }

        .crt .b1 {
            inset: 1.2% 1% 1.8% 1.1%;
            border: .25cqw solid #0f2a5c
        }

        .crt .b2 {
            inset: 2.8% 2.2% 3.6% 2.3%;
            border: .2cqw solid #d4a52b
        }

        .crt .lg {
            left: 7.8%;
            top: 5.5%;
            display: flex;
            align-items: center;
            gap: 1cqw
        }

        .crt .lg svg {
            width: 7cqw
        }

        .crt .lg .t {
            font-size: 4.2cqw;
            font-weight: 800;
            line-height: 1;
            border: 0;
            padding: 0
        }

        .crt .lg .t span {
            color: #d4a52b
        }

        .crt .lg small {
            display: block;
            font-size: 1.2cqw;
            letter-spacing: .25em;
            font-weight: 500;
            margin-top: .5cqw
        }

        .crt .no {
            right: 9.5%;
            top: 5.8%;
            font-size: 1.3cqw;
            font-weight: 500
        }

        .crt .seal {
            right: 7.5%;
            top: 9%;
            width: 10.5cqw
        }

        .crt .h1 {
            left: 0;
            right: 0;
            top: 12.5%;
            text-align: center;
            font-family: "Playfair Display", Georgia, serif;
            font-weight: 800;
            font-size: 6.3cqw;
            letter-spacing: .04em;
            line-height: 1
        }

        .crt .h2 {
            left: 0;
            right: 0;
            top: 25%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2cqw;
            font-family: "Playfair Display", Georgia, serif;
            font-size: 3.4cqw;
            font-weight: 700;
            letter-spacing: .08em
        }

        .crt .h2:before,
        .crt .h2:after {
            content: "";
            width: 12cqw;
            height: .2cqw;
            background: #d4a52b
        }

        .crt .cf {
            left: 0;
            right: 0;
            top: 31%;
            text-align: center;
            font-size: 1.7cqw;
            letter-spacing: .2em;
            font-weight: 600
        }

        .crt .nm {
            left: 0;
            right: 0;
            top: 34.5%;
            text-align: center;
            white-space: nowrap;
            font-family: "Great Vibes", "Segoe Script", "Brush Script MT", cursive;
            line-height: 1.1
        }

        .crt .ln {
            left: 24.5%;
            right: 24.5%;
            top: 43.5%;
            height: .2cqw;
            background: #d4a52b
        }

        .crt .t1 {
            left: 0;
            right: 0;
            top: 46.5%;
            text-align: center;
            font-size: 1.9cqw
        }

        .crt .cr {
            left: 0;
            right: 0;
            top: 50.8%;
            text-align: center;
            font-size: 2.5cqw;
            font-weight: 700
        }

        .crt .t2 {
            left: 12%;
            right: 12%;
            top: 57%;
            text-align: center;
            font-size: 1.6cqw;
            line-height: 1.5
        }

        .crt .inf {
            left: 14%;
            right: 14%;
            top: 64%;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .crt .inf .i {
            display: flex;
            gap: 1.2cqw;
            align-items: center;
            font-size: 1.4cqw
        }

        .crt .inf .i svg {
            width: 3.2cqw;
            height: 3.2cqw
        }

        .crt .inf b {
            display: block;
            font-size: 1.55cqw
        }

        .crt .sep {
            width: .15cqw;
            height: 4.5cqw;
            background: #d4a52b
        }

        .crt .wish {
            left: 0;
            right: 0;
            top: 74%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.6cqw;
            font-size: 1.25cqw;
            letter-spacing: .2em;
            font-weight: 500
        }

        .crt .wish:before,
        .crt .wish:after {
            content: "";
            width: 5cqw;
            height: .15cqw;
            background: #d4a52b
        }

        .crt .sg {
            top: 79%;
            width: 24%;
            text-align: center;
            font-size: 1.3cqw
        }

        .crt .sg.l {
            left: 8.5%
        }

        .crt .sg.r {
            right: 8.5%
        }

        .crt .sg .s {
            font-family: "Great Vibes", "Segoe Script", "Brush Script MT", cursive;
            font-size: 3.6cqw;
            height: 5.5cqw;
            line-height: 5.5cqw;
            border-bottom: .15cqw solid #d4a52b;
            margin-bottom: .8cqw;
            white-space: nowrap;
            overflow: hidden
        }

        .crt .sg b {
            display: block;
            font-size: 1.5cqw
        }

        @page {
            size: landscape;
            margin: 0
        }

        @media print {
            body * {
                visibility: hidden
            }

            .crt,
            .crt * {
                visibility: visible
            }

            .crt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <nav><a class="logo" href="/">Intern<span>Path</span></a>
            <div id="nav"></div>
        </nav>
        <div id="app"></div>
    </div>
    <script>
        var tok = localStorage.getItem('tok');
        var user = JSON.parse(localStorage.getItem('user') || 'null');
        var mode = (location.hash === '#register') ? 'register' : 'login';
        var $ = function (i) { return document.getElementById(i) };
        var app = $('app');

        // ---- Edit these three for your certificate ----
        var CERT_DURATION = '4 Weeks', CERT_TUTOR = 'Arun Kumar', CERT_TUTOR_ROLE = 'Data Analytics Expert';

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }

        async function api(p, m, b) {
            var r = await fetch('/api/' + p, { method: m || 'GET', headers: Object.assign({ 'Content-Type': 'application/json' }, tok ? { Authorization: 'Bearer ' + tok } : {}), body: b ? JSON.stringify(b) : undefined });
            var d = await r.json().catch(function () { return {} });
            if (r.status === 401 && tok) { logout(); throw new Error(d.error) }
            if (!r.ok) throw new Error(d.error || 'Something went wrong');
            return d;
        }
        function logout() { tok = null; user = null; localStorage.clear(); start() }
        function badge(s) { return s ? '<span class="st ' + s + '">' + (s === 'Changes' ? 'Changes requested' : s) + '</span>' : '<span class="st">Assigned</span>' }

        function authView() {
            $('nav').innerHTML = '';
            var reg = (mode === 'register');
            var courses = ['Web Development', 'Data Analysis', 'Digital Marketing', 'UI/UX Design', 'Python Programming'];
            var extra = '';
            if (reg) {
                extra = '<input id="n" placeholder="Full name"><select id="c"><option value="">Select your course</option>' +
                    courses.map(function (x) { return '<option>' + x + '</option>' }).join('') + '</select>';
            }
            app.innerHTML =
                '<div class="card auth"><h2>' + (reg ? 'Create student account' : 'Log in') + '</h2>' + extra +
                '<input id="e" type="email" placeholder="Email">' +
                '<input id="p" type="password" placeholder="Password (6+ characters)">' +
                '<div class="err" id="er"></div>' +
                '<button class="btn" id="go" style="width:100%">' + (reg ? 'Sign up' : 'Log in') + '</button>' +
                '<p class="sub" style="margin:14px 0 0;text-align:center"><a href="#" id="tg">' + (reg ? 'Have an account? Log in' : 'New student? Create an account') + '</a></p></div>' +
                verifyBox();
            $('tg').onclick = function (e) { e.preventDefault(); mode = reg ? 'login' : 'register'; authView() };
            $('go').onclick = async function () {
                try {
                    var d = await api(mode, 'POST', { name: $('n') ? $('n').value : undefined, course: $('c') ? $('c').value : undefined, email: $('e').value, password: $('p').value });
                    tok = d.token; user = d.user;
                    localStorage.setItem('tok', tok); localStorage.setItem('user', JSON.stringify(user));
                    start();
                } catch (e) { $('er').textContent = e.message }
            };
            bindVerify();
        }
        function verifyBox() { return '<div class="card auth" style="margin-top:0"><h2>Verify a certificate</h2><input id="vid" placeholder="Certificate ID (e.g. IP-1A2B3C4D)"><button class="btn o" id="vb" style="width:100%">Verify</button><div id="vr" style="margin-top:10px"></div></div>' }
        function bindVerify() {
            $('vb').onclick = async function () {
                try {
                    var d = await api('verify/' + encodeURIComponent($('vid').value.trim()));
                    $('vr').innerHTML = '<span class="ok">✅ Valid: issued to ' + esc(d.name) + ' on ' + new Date(d.issued_at).toLocaleDateString() + '</span>';
                } catch (e) { $('vr').innerHTML = '<span class="err">❌ Certificate not found</span>' }
            };
        }
        function header() { $('nav').innerHTML = '<span class="sub" style="margin:0 10px 0 0">' + esc(user.name) + ' (' + user.role + ')</span><button class="btn o" id="lo">Log out</button>'; $('lo').onclick = logout }

        function certHTML(c) {
            var sz = c.name.length > 20 ? 4.6 : c.name.length > 14 ? 6 : 8;
            var first = function (s) { return esc(String(s).split(' ')[0]) };
            var dt = new Date(c.issued_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            var ic = 'viewBox="0 0 24 24" fill="none" stroke="#0f2a5c" stroke-width="1.6" stroke-linejoin="round"';
            return '<div class="crt">' +
                '<svg class="cw" viewBox="0 0 1280 853" preserveAspectRatio="none"><path d="M0 0H215C120 30 40 90 0 190Z" fill="#0f2a5c"/><path d="M215 0H250C140 40 50 110 0 215V190C40 90 120 30 215 0Z" fill="#d4a52b"/><path d="M1280 853H1045C1160 820 1245 760 1280 660Z" fill="#0f2a5c"/><path d="M1045 853H1010C1130 815 1230 745 1280 640V660C1245 760 1160 820 1045 853Z" fill="#d4a52b"/></svg>' +
                '<div class="b1"></div><div class="b2"></div>' +
                '<div class="lg"><svg viewBox="0 0 100 80"><path d="M50 5L98 28L50 50L2 28Z" fill="#0f2a5c"/><path d="M22 42V62Q50 78 78 62V42L50 56Z" fill="#0f2a5c"/><path d="M88 31V60" stroke="#d4a52b" stroke-width="3"/><circle cx="88" cy="63" r="4" fill="#d4a52b"/></svg><div><div class="t">Intern<span>path</span></div><small>Learn | Build | Grow</small></div></div>' +
                '<div class="no">Certificate No: ' + esc(c.id) + '</div>' +
                '<svg class="seal" viewBox="0 0 120 165"><path d="M35 100L20 160L42 150L55 160L62 105Z" fill="#0f2a5c"/><path d="M85 100L100 160L78 150L65 160L58 105Z" fill="#0f2a5c"/><circle cx="60" cy="60" r="54" fill="none" stroke="#d4a52b" stroke-width="10" stroke-dasharray="9 5"/><circle cx="60" cy="60" r="52" fill="#d4a52b"/><circle cx="60" cy="60" r="43" fill="#0f2a5c"/><circle cx="60" cy="60" r="37" fill="none" stroke="#d4a52b" stroke-width="1.5"/><path d="M60 38L88 50L60 62L32 50Z" fill="#d4a52b"/><path d="M44 57V69Q60 77 76 69V57L60 64Z" fill="#d4a52b"/><path d="M85 52V68" stroke="#d4a52b" stroke-width="2"/></svg>' +
                '<div class="h1">CERTIFICATE</div><div class="h2">OF COMPLETION</div>' +
                '<div class="cf">THIS IS TO CERTIFY THAT</div>' +
                '<div class="nm" style="font-size:' + sz + 'cqw">' + esc(c.name) + '</div><div class="ln"></div>' +
                '<div class="t1">has successfully completed the Internship Program in</div>' +
                '<div class="cr">' + esc(c.course || 'Internship Program') + '</div>' +
                '<div class="t2">offered by <b>Internpath</b>, in collaboration with our training partner,<br>and has demonstrated dedication, enthusiasm and a strong commitment to learning.</div>' +
                '<div class="inf">' +
                '<div class="i"><svg ' + ic + '><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><div>Program Duration<b>' + esc(CERT_DURATION) + '</b></div></div><div class="sep"></div>' +
                '<div class="i"><svg ' + ic + '><path d="M12 6c-2-1.5-5-2-9-2v14c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2zM12 6v14"/></svg><div>Mode of Learning<b>Online</b></div></div><div class="sep"></div>' +
                '<div class="i"><svg ' + ic + '><rect x="4" y="3" width="16" height="13" rx="1"/><path d="M8 8h8M8 11h5"/><circle cx="12" cy="19" r="3"/></svg><div>Completion Date<b>' + dt + '</b></div></div>' +
                '</div>' +
                '<div class="wish">WE WISH YOU ALL THE BEST FOR YOUR FUTURE ENDEAVORS!</div>' +
                '<div class="sg l"><div class="s">' + first(CERT_TUTOR) + '</div>Program Tutor<b>' + esc(CERT_TUTOR) + '</b>' + esc(CERT_TUTOR_ROLE) + '</div>' +
                '<div class="sg r"><div class="s">' + first(c.name) + '</div>Student Signature<b>' + esc(c.name) + '</b></div>' +
                '</div>' +
                '<div style="text-align:center;margin-bottom:14px"><button class="btn" onclick="window.print()">🖨 Print / Save as PDF</button></div>';
        }

        async function studentView() {
            header();
            var d = await api('tasks'), t = d.tasks;
            var n = t.filter(function (k) { return k.status === 'Approved' }).length;
            var p = t.length ? Math.round(n / t.length * 100) : 0, cert = '';
            if (t.length && n === t.length) { cert = certHTML(await api('certificate')) }
            else cert = '<div class="card sub" style="text-align:center">🔒 Your certificate unlocks when all tasks are approved.</div>';
            app.innerHTML = '<h1>My internship</h1><p class="sub">Complete all tasks to earn your certificate.</p>' +
                '<div class="card"><b>' + n + ' of ' + t.length + '</b> tasks approved (' + p + '%)<div class="bar"><i style="width:' + p + '%"></i></div></div>' + cert +
                '<div class="card"><h2>My tasks</h2>' + (t.length ? t.map(function (k) {
                    var f = k.status === 'Approved' ? '<p>✅ Approved</p>' : k.status === 'Submitted' ? '<p>⏳ Waiting for review…</p>' :
                        (k.feedback ? '<p style="color:#d9435a">Feedback: ' + esc(k.feedback) + '</p>' : '') + '<div class="sl"><input id="l' + k.id + '" placeholder="Link to your work (GitHub, Drive…)" value="' + esc(k.link) + '"><button class="btn" data-sub="' + k.id + '">Submit</button></div>';
                    return '<div class="t"><h3>' + esc(k.title) + badge(k.status) + '</h3><p>' + esc(k.description) + (k.due ? ' · Due ' + esc(k.due) : '') + '</p>' + f + '</div>';
                }).join('') : '<p class="sub">No tasks assigned yet.</p>') + '<div class="err" id="er"></div></div>';
            app.onclick = async function (e) {
                var i = e.target.getAttribute('data-sub'); if (!i) return;
                try { await api('tasks/' + i + '/submit', 'POST', { link: $('l' + i).value }); studentView() } catch (x) { $('er').textContent = x.message }
            };
        }

        function tbl(h, r) {
            return '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem"><tr>' +
                h.map(function (x) { return '<th style="text-align:left;padding:8px;border-bottom:1px solid var(--border)">' + x + '</th>' }).join('') + '</tr>' +
                r.map(function (row) { return '<tr>' + row.map(function (x) { return '<td style="padding:8px;border-bottom:1px solid var(--border)">' + x + '</td>' }).join('') + '</tr>' }).join('') + '</table></div>';
        }

        async function adminView() {
            header();
            var d = await api('tasks'), s = await api('students'), st = s.students, T = s.total;
            var isDone = function (x) { return T > 0 && x.approved >= T };
            var fin = st.filter(isDone).length, by = {};
            st.forEach(function (x) { var c = x.course || 'Not selected'; by[c] = by[c] || { n: 0, f: 0 }; by[c].n++; if (isDone(x)) by[c].f++ });
            var cards = [['Total students', st.length], ['Finished', fin], ['In progress', st.length - fin], ['Tasks assigned', T]].map(function (r) {
                return '<div class="card" style="margin:0;text-align:center"><div style="font-size:1.8rem;font-weight:800;color:var(--accent)">' + r[1] + '</div><div class="sub" style="margin:0">' + r[0] + '</div></div>';
            }).join('');
            app.innerHTML = '<h1>Admin dashboard</h1><p class="sub">Overview of your students and their progress.</p>' +
                '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px">' + cards + '</div>' +
                '<div class="card"><h2>Students by course</h2>' + (st.length ? tbl(['Course', 'Enrolled', 'Finished'], Object.keys(by).map(function (c) { return [esc(c), by[c].n, by[c].f] })) : '<p class="sub">No students yet.</p>') + '</div>' +
                '<div class="card"><h2>All students</h2>' + (st.length ? tbl(['Name', 'Email', 'Course', 'Progress', 'Status'], st.map(function (x) {
                    return [esc(x.name), esc(x.email), esc(x.course || '—'), x.approved + ' / ' + T, isDone(x) ? '✅ Finished' : 'In progress'];
                })) : '<p class="sub">No students have signed up yet.</p>') + '</div>' +
                '<div class="card"><h2>New task</h2><input id="tt" placeholder="Task title"><textarea id="td" rows="2" placeholder="Describe what students should do"></textarea><input id="tu" type="date"><div class="err" id="er"></div><button class="btn" id="add">+ Assign task</button></div>' +
                '<div class="card"><h2>Submissions to review</h2>' + (d.subs.length ? d.subs.map(function (x) {
                    var tk = d.tasks.find(function (k) { return k.id === x.task_id });
                    return '<div class="t"><h3>' + esc(x.student) + ' — ' + esc(tk ? tk.title : '') + badge(x.status) + '</h3><p><a href="' + esc(x.link) + '" target="_blank" rel="noopener">' + esc(x.link) + '</a></p>' +
                        (x.status === 'Submitted' ? '<div class="acts"><button class="btn g" data-ap="' + x.id + '">Approve</button><button class="btn r" data-ch="' + x.id + '">Request changes</button></div>' : '') + '</div>';
                }).join('') : '<p class="sub">No submissions yet.</p>') + '</div>' +
                '<div class="card"><h2>All tasks</h2>' + (d.tasks.map(function (k) { return '<div class="t"><h3>' + esc(k.title) + '</h3><p>' + esc(k.description) + (k.due ? ' · Due ' + esc(k.due) : '') + '</p><div class="acts"><button class="btn r" data-del="' + k.id + '">Delete</button></div></div>' }).join('') || '<p class="sub">No tasks yet.</p>') + '</div>';
            $('add').onclick = async function () { try { await api('tasks', 'POST', { title: $('tt').value, description: $('td').value, due: $('tu').value }); adminView() } catch (x) { $('er').textContent = x.message } };
            app.onclick = async function (e) {
                var g = function (a) { return e.target.getAttribute(a) };
                if (g('data-ap')) await api('submissions/' + g('data-ap') + '/review', 'POST', { status: 'Approved' });
                else if (g('data-ch')) { var f = prompt('Feedback for the student:'); if (f === null) return; await api('submissions/' + g('data-ch') + '/review', 'POST', { status: 'Changes', feedback: f }) }
                else if (g('data-del')) { if (!confirm('Delete this task and its submissions?')) return; await api('tasks/' + g('data-del'), 'DELETE') }
                else return;
                adminView();
            };
        }

        function start() {
            if (!tok) return authView();
            (user.role === 'admin' ? adminView() : studentView()).catch(function (e) { app.innerHTML = '<p class="err">' + esc(e.message) + '</p>' });
        }
        start();
    </script>
</body>

</html>
